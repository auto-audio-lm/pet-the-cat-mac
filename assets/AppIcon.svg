<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Pet the Cat app icon: a content orange tabby (eyes closed while being petted) with haptic ripples
       rising from the top of its head. macOS icon grid: 824 x 824 tile at (100, 100), corner radius 185. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF3E7"/>
      <stop offset="1" stop-color="#EAD7BE"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#F7BD77"/>
      <stop offset="0.55" stop-color="#EC9447"/>
      <stop offset="1" stop-color="#D2722C"/>
    </radialGradient>
    <radialGradient id="muzzle" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FFF4E4"/>
      <stop offset="1" stop-color="#FCE3C4"/>
    </radialGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
    <clipPath id="headClip">
      <path id="headShape" d="M512 372 C 690 372, 790 470, 790 610 C 790 760, 670 836, 512 836 C 354 836, 234 760, 234 610 C 234 470, 334 372, 512 372 Z"/>
    </clipPath>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 3.5h14M0 10.5h14" stroke="#B89C7A" stroke-opacity="0.10" stroke-width="2"/>
      <path d="M3.5 0v14M10.5 0v14" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- tile: linen cushion -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#weave)"/>

    <!-- haptic ripples above the head -->
    <g fill="none" stroke="#E8893D" stroke-linecap="round">
      <path d="M412 322 A 140 140 0 0 1 612 322" stroke-width="24" opacity="0.85"/>
      <path d="M366 266 A 205 205 0 0 1 658 266" stroke-width="22" opacity="0.55"/>
      <path d="M322 212 A 270 270 0 0 1 702 212" stroke-width="20" opacity="0.3"/>
    </g>

    <!-- soft shadow under the head -->
    <ellipse cx="512" cy="840" rx="250" ry="40" fill="#6B4526" opacity="0.35" filter="url(#soft)"/>

    <!-- ears -->
    <path d="M262 520 C 250 430, 262 350, 300 300 C 350 320, 400 360, 440 405 Z" fill="#DA7B33" stroke="#DA7B33" stroke-width="18" stroke-linejoin="round"/>
    <path d="M296 470 C 292 420, 298 380, 318 350 C 348 366, 374 388, 398 414 Z" fill="#F2A493"/>
    <path d="M762 520 C 774 430, 762 350, 724 300 C 674 320, 624 360, 584 405 Z" fill="#DA7B33" stroke="#DA7B33" stroke-width="18" stroke-linejoin="round"/>
    <path d="M728 470 C 732 420, 726 380, 706 350 C 676 366, 650 388, 626 414 Z" fill="#F2A493"/>

    <!-- head -->
    <use href="#headShape" fill="url(#fur)"/>
    <g clip-path="url(#headClip)">
      <!-- forehead tabby stripes -->
      <g fill="none" stroke="#B85C22" stroke-linecap="round" opacity="0.6">
        <path d="M512 380 L 512 470" stroke-width="22"/>
        <path d="M462 386 L 472 456" stroke-width="18"/>
        <path d="M562 386 L 552 456" stroke-width="18"/>
      </g>
      <!-- cheek stripes -->
      <g fill="none" stroke="#B85C22" stroke-linecap="round" stroke-width="16" opacity="0.5">
        <path d="M234 600 L 300 612"/><path d="M240 650 L 300 652"/>
        <path d="M790 600 L 724 612"/><path d="M784 650 L 724 652"/>
      </g>
      <!-- muzzle -->
      <ellipse cx="512" cy="712" rx="150" ry="104" fill="url(#muzzle)"/>
    </g>

    <!-- closed, content eyes -->
    <g fill="none" stroke="#4A2C17" stroke-linecap="round" stroke-width="20">
      <path d="M352 600 Q 400 640 448 600"/>
      <path d="M576 600 Q 624 640 672 600"/>
    </g>
    <!-- blush -->
    <ellipse cx="348" cy="672" rx="44" ry="24" fill="#F08A7E" opacity="0.45"/>
    <ellipse cx="676" cy="672" rx="44" ry="24" fill="#F08A7E" opacity="0.45"/>
    <!-- nose and mouth -->
    <path d="M486 664 L 538 664 Q 512 700 512 700 Q 512 700 486 664 Z" fill="#E77F86" stroke="#E77F86" stroke-width="10" stroke-linejoin="round"/>
    <path d="M512 700 L 512 722 M 512 722 Q 488 748 462 726 M 512 722 Q 536 748 562 726" fill="none" stroke="#4A2C17" stroke-width="12" stroke-linecap="round"/>
    <!-- whiskers -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="8" opacity="0.9">
      <path d="M400 700 Q 320 686 236 700"/><path d="M402 728 Q 322 732 248 760"/>
      <path d="M624 700 Q 704 686 788 700"/><path d="M622 728 Q 702 732 776 760"/>
    </g>
  </g>
</svg>
